<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园 · 三维重建</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<main id="viewport"></main><header><div class="brand"><span class="mark">◈</span><div><strong>校园 · 三维重建</strong><small>CAMPUS / SPATIAL STUDY 01</small></div></div><button id="time-toggle" aria-pressed="false" title="切换白天与夜间">☀ 白天 <span>切换夜景</span></button><div class="badge"><i></i> 照片重建 · 第一版</div></header>
<button id="panel-toggle" type="button" aria-controls="campus-panel" aria-expanded="true" aria-label="收起控制面板" title="收起控制面板">‹</button><aside id="campus-panel"><div class="eyebrow">EXPLORE THE CAMPUS</div><h1>重游校园，<br>再见少年。</h1><p class="campus-subtitle">走过熟悉的路，重拾那时的光。</p><div class="rule"></div><section class="season-picker" aria-label="四季景色"><label>四季景色</label><div class="season-buttons"><button data-season="spring" aria-pressed="false">春</button><button data-season="summer" aria-pressed="true">夏</button><button data-season="autumn" aria-pressed="false">秋</button><button data-season="winter" aria-pressed="false">冬</button></div><p id="season-note" aria-live="polite">浓绿树荫 · 枝叶繁茂</p></section><section class="music-player" aria-label="季节音乐"><label>季节音乐</label><p id="music-title"></p><button id="music-toggle" aria-pressed="false">播放音乐</button><label class="music-volume">音量 <input id="music-volume" type="range" min="0" max="100" value="30"><output id="music-volume-value">30%</output></label><p id="music-status" aria-live="polite">正在加载…</p></section><button id="walk-enter" class="export" style="margin-bottom:16px">🚶 进入校园 · 第一人称</button><button id="shoot-start" class="export">🏀 挑战坤坤 · 五轮三分</button><p class="snow-hint">走近坤坤也可按 E 开始</p><label>观察视角</label><nav id="views"><button data-view="overview" class="active"><span>01</span> 全校鸟瞰 <b>↗</b></button><button data-view="plan"><span>02</span> 总平面 <b>⊞</b></button><button data-view="sports"><span>03</span> 运动场一侧 <b>↗</b></button><button data-view="axis"><span>04</span> 中央广场 <b>↗</b></button><button data-view="court"><span>05</span> 教学楼庭院 <b>↗</b></button><button data-view="connection"><span>06</span> 场馆楼梯 <b>↗</b></button><button data-view="gate"><span>07</span> 校门入口 <b>↗</b></button><button data-view="sculpture"><span>08</span> 广场雕塑 <b>↗</b></button><button data-view="snowmen"><span>❄</span> 操场雪人近景 <b>↗</b></button><button data-view="player"><span>09</span> 坤坤 · 正面 <b>↗</b></button><button data-view="playerBack"><span>10</span> 坤坤 · 背面 <b>↗</b></button><button data-view="life">操场生活 · 全景 ↗</button><button data-view="lifeBadminton">羽毛球近景 ↗</button><button data-view="lifeCards">草坪打牌 ↗</button><button data-view="lifePicnic">野餐聊天 ↗</button><button data-view="standBridge">看台顶部连廊 ↗</button><button data-view="lifeFootball">足球传接近景 ↗</button></nav><div class="rule"></div><label>场景设置</label><div class="toggles"><button id="labels" aria-pressed="false">建筑标注</button><button id="rotate" aria-pressed="false">自动环绕</button></div><button id="practice" class="export" style="margin-top:10px" aria-pressed="false">暂停练球</button><label class="light">日光角度 <input id="sun" type="range" min="15" max="85" value="48"></label><section class="weather-panel" aria-label="雷雨设置"><button id="weather-toggle" class="export" aria-pressed="false">开启雷雨</button><p id="weather-note" class="snow-hint" aria-live="polite">春夏秋可用 · 阴天、雨声与湿润地面</p><label class="light" for="weather-volume">雨声与雷声 <output id="weather-volume-value">20%</output><input id="weather-volume" type="range" min="0" max="100" value="20"></label></section><section aria-label="飘雪设置"><label class="light" for="snow-density">雪花密度 <output id="snow-density-value">50%</output><input id="snow-density" type="range" min="0" max="100" step="5" value="50"></label><label class="light" for="snow-size">雪花大小 <output id="snow-size-value">50%</output><input id="snow-size" type="range" min="10" max="100" step="5" value="50"></label><p class="snow-hint">冬季生效 · 100% 为此前效果</p></section><div class="note">按照片比例估算，非测绘模型。<br>建筑名称按提供的信息标注。</div></aside>
<div id="walk-hud" hidden><span>WASD 行走 · Shift 快走 · 鼠标环顾 · Esc 菜单</span><span id="walk-action-note"></span><button id="walk-sit">坐下 C</button><button id="walk-lie">躺下 Z</button><button id="walk-bike">上下车 F</button><button id="walk-resume">继续行走</button><button id="walk-home">回到校门</button><button id="walk-exit">返回鸟瞰</button></div><div id="walk-crosshair" hidden>+</div><div id="labels-layer"></div><footer><span><i></i> <b id="status">正在构建校园…</b></span><span class="hint">左键旋转 / 滚轮缩放 / 右键平移</span><button id="capture" title="保存当前视角图片">保存截图 ↗</button></footer><div id="toast" role="status"></div><div id="loading">正在还原校园空间…</div><script type="module" src="main.js"></script><script type="module" src="music.js"></script><script type="module" src="panel.js"></script></body></html>
